name: Windows offline acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify official runtime, protect installation and run acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./Install-WindowsAdminMCP.ps1
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "INSTALL_FAILED" }
          & 'C:\Program Files\WindowsAdminMCP\Test-WindowsAdminMCP.ps1'
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "ACCEPTANCE_FAILED" }
          $raw = & 'C:\Program Files\WindowsAdminMCP\WindowsAdminMCP.ps1' status
          $check = ($raw | Select-Object -Last 1 | ConvertFrom-Json)
          if (-not $check.installed -or -not $check.integrity_ok) { throw "STATUS_INCOMPLETE" }
          Write-Host "OPERATOR_STATUS=PASS"
          # Confirm all three tools and modern protocol after clean installation.
          $modern = [IO.File]::ReadAllText('C:\Program Files\WindowsAdminMCP\windows-admin-mcp.ps1')
          if ($modern -notmatch '2026-07-28' -or $modern -notmatch 'powershell_screenshot') { throw 'MODERN_PROTOCOL_OR_IMAGE_MISSING' }
          Write-Host "MCP_MODERN_AND_SCREENSHOT_SOURCE=PASS"
          # Vendor v0.0.19 supports this flag; the single operator launcher must set it.
          $launcher=[IO.File]::ReadAllText('C:\Program Files\WindowsAdminMCP\WindowsAdminMCP.ps1')
          if($launcher -notmatch "MCP_STDIO_SEND_INITIALIZED_NOTIFICATION='true'"){
             throw "STDIO_INITIALIZATION_SHIM_NOT_ENABLED"
          }
          $bin='C:\Program Files\WindowsAdminMCP\client\tunnel-client-runtime.exe'
          $helpText=(& $bin run --help 2>&1|Out-String)
          if($helpText -notmatch 'mcp.stdio-send-initialized-notification'){
             throw "VENDOR_RUNTIME_LACKS_INITIALIZED_SHIM"
          }
          Write-Host "STDIO_INIT_SHIM_AND_VENDOR_SUPPORT=PASS"
          # Verify tunnel ID auto-discovery without using or logging real identifiers.
          . 'C:\Program Files\WindowsAdminMCP\WindowsAdminMCP.ps1' -Action status | Out-Null
          $dummyId = 'tunnel_' + ('a' * 32)
          $argEquals = '--control-plane.tunnel-id=' + $dummyId + ' --other-flag'
          $argSpaced = '--control-plane.tunnel-id ' + $dummyId + ' --other-flag'
          $oldLine = 'if ($env:CONTROL_PLANE_TUNNEL_ID) { $env:CONTROL_PLANE_TUNNEL_ID = "' + $dummyId + '" }'
          if ((Get-TunnelIdFromText $argEquals) -cne $dummyId) { throw 'AUTO_ID_EQUALS_FAILED' }
          if ((Get-TunnelIdFromText $argSpaced) -cne $dummyId) { throw 'AUTO_ID_SPACED_FAILED' }
          if ((Get-TunnelIdFromText $oldLine) -cne $dummyId) { throw 'AUTO_ID_ROLLBACK_FAILED' }
          if ($null -ne (Get-TunnelIdFromText 'invalid without any ID')) { throw 'AUTO_ID_INVALID_ACCEPTED' }
          Write-Host "TUNNEL_ID_AUTODISCOVERY_TESTS=4/4_PASS"

  r0:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build pinned SDK and verify wire contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build research/R0SdkProbe/R0SdkProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'SDK_BUILD_FAILED' }
          ./research/R0SdkProbe/Test-Wire.ps1 -Dll research/R0SdkProbe/bin/Release/net10.0/R0SdkProbe.dll
      - name: Exercise SCM, SQLite, Job Objects and shared MCP queue
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish research/R0NativeProbe/R0NativeProbe.csproj -c Release -r win-x64 --self-contained true -o "${{ runner.temp }}/R0NativeProbe"
          if ($LASTEXITCODE -ne 0) { throw 'PUBLISH_FAILED' }
          ./research/R0NativeProbe/Test-Native.ps1 -Exe "${{ runner.temp }}/R0NativeProbe/R0NativeProbe.exe" -SdkDll research/R0SdkProbe/bin/Release/net10.0/R0SdkProbe.dll
      - name: Publish and verify actual native application R1 status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/WindowsAdminMcp/WindowsAdminMcp.csproj -c Release -r win-x64 --self-contained true -o "${{ runner.temp }}/WindowsAdminMcpCandidate"
          if ($LASTEXITCODE -ne 0) { throw 'R1_PUBLISH_FAILED' }
          ./tests/Test-NativeStatus.ps1 -Exe "${{ runner.temp }}/WindowsAdminMcpCandidate/WindowsAdminMCP.exe"
      - name: Exercise actual bounded PowerShell runner before MCP wiring
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tests/RunnerTests/RunnerTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'R2_RUNNER_FAILED' }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WindowsAdminMcp-candidate-win-x64
          path: "${{ runner.temp }}/WindowsAdminMcpCandidate/"
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r0-package-locks
          path: |
            research/**/packages.lock.json
            src/**/packages.lock.json
          if-no-files-found: warn
