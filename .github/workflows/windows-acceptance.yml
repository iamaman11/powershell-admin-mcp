name: Windows offline acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: windows-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    # Full PR acceptance is not repeated after merge. Main still builds an
    # exact-commit package and checks a real offline install and rollback.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - name: Require full acceptance for unreviewed direct main pushes
        id: provenance
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          # Fail closed: uncertainty about the PR/CI association means full
          # tests, never shortened main acceptance. No extra publish.
          $full=$true
          try {
            $prs=@(gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls" | ConvertFrom-Json)
            if($LASTEXITCODE -ne 0){throw 'PR_PROVENANCE_UNAVAILABLE'}
            foreach($pr in $prs){
              if(-not $pr.merged_at -or $pr.merge_commit_sha -cne $env:GITHUB_SHA -or
                  $pr.base.ref -cne 'main'){continue}
              $head=$pr.head.sha
              $runs=gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/windows-acceptance.yml/runs?event=pull_request&head_sha=$head&per_page=100"|ConvertFrom-Json
              if($LASTEXITCODE -ne 0){throw 'PR_ACCEPTANCE_UNAVAILABLE'}
              $accepted=@($runs.workflow_runs|Where-Object {
                $_.status -eq 'completed' -and $_.conclusion -eq 'success' -and
                $_.event -eq 'pull_request' -and $_.head_sha -ceq $head -and
                $_.head_branch -ceq $pr.head.ref -and
                $_.head_repository.full_name -ceq $pr.head.repo.full_name -and
                # GitHub may clear workflow_run.pull_requests after merging.
                # Exact SHA + branch + repository still prove the tested head;
                # a nonempty association must explicitly name this PR.
                (@($_.pull_requests).Count -eq 0 -or
                    @($_.pull_requests|Where-Object number -eq $pr.number).Count -gt 0)
              })
              if($accepted.Count -gt 0){$full=$false;break}
            }
          }catch{Write-Warning 'PR acceptance could not be proved; running full main tests'}
          "full=$($full.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "MAIN_PUSH_FULL_ACCEPTANCE=$full"
      - name: Parse PowerShell sources before expensive tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @(Get-ChildItem . -Filter '*.ps1' -File -Recurse)){
            $tokens=$null;$errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              foreach($err in $errors){Write-Host ("PARSE_FAILURE {0}:{1} {2}" -f $file.Name,$err.Extent.StartLineNumber,$err.ErrorId)}
              throw 'POWERSHELL_PARSE_FAILED'
            }
          }
          Write-Host 'POWERSHELL_PARSE=PASS'
          ./tests/Test-OperatorUpdate.ps1
          ./installer/Sync-VendorLock.ps1
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prove exact SDK pin
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pin=Get-Content global.json -Raw|ConvertFrom-Json
          $actual=& dotnet --version
          if($LASTEXITCODE -ne 0 -or $actual -cne $pin.sdk.version -or $pin.sdk.rollForward -cne 'disable'){throw 'SDK_PIN_MISMATCH'}
          Write-Host "DOTNET_SDK_EXACT=$actual"
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', 'Directory.Packages.props', '**/*.csproj', '**/packages.lock.json') }}
      - name: Restore all project graphs with committed lock files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $projects=@('tests/RunnerTests/RunnerTests.csproj',
                      'src/WindowsAdminMcp/WindowsAdminMcp.csproj',
                      'research/R0SdkProbe/R0SdkProbe.csproj',
                      'research/R0NativeProbe/R0NativeProbe.csproj')
          foreach($project in $projects){
            $root=Split-Path -Parent $project
            $lock=Join-Path $root 'packages.lock.json'
            if(-not(Test-Path -LiteralPath $lock -PathType Leaf)){throw "NUGET_LOCK_MISSING: $project"}
            $rid=if($project -in @('src/WindowsAdminMcp/WindowsAdminMcp.csproj', 'research/R0NativeProbe/R0NativeProbe.csproj')){@('-r','win-x64')}else{@()}
            dotnet restore $project --locked-mode @rid
            if($LASTEXITCODE -ne 0){throw "NUGET_LOCK_RESTORE_FAILED: $project"}
            Write-Host ("NUGET_LOCK_GRAPH {0} {1}" -f $project,(Get-FileHash -LiteralPath $lock -Algorithm SHA256).Hash)
          }
          ./tests/Test-NuGetLock.ps1
      - name: Exercise actual bounded PowerShell runner and typed UI contract
        if: github.event_name != 'push' || steps.provenance.outputs.full == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tests/RunnerTests/RunnerTests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'R2_RUNNER_FAILED' }
      - name: Verify unified startup definition without registering a live tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $plan=./installer/NativeStartup.ps1 -Action Plan | ConvertFrom-Json
          if($plan.mutated -or $plan.service_start -ne 'Automatic' -or $plan.trigger -ne 'MSFT_TaskLogonTrigger' -or $plan.logon -ne 'Interactive' -or $plan.run_level -ne 'Highest' -or $plan.arguments -ne 'tunnel' -or $plan.multiple_instances -ne 'IgnoreNew' -or $plan.restart_count -ne 3){throw 'NATIVE_STARTUP_PLAN_INVALID'}
          Write-Host 'R6_STARTUP_DEFINITION=PASS (plan only; no task registered)'
      # This is a fixed historical upgrade fixture. Cache its tested ZIP,
      # not mutable compiler outputs or the current commit's release binary.
      # Main never needs the historical candidate again after PR acceptance.
      - uses: actions/cache@v6
        if: github.event_name != 'push' || steps.provenance.outputs.full == 'true'
        with:
          path: |
            ${{ runner.temp }}/wmcp-legacy-fed40dc07d9a6f6651430e54b0c48529b80f0327.zip
            ${{ runner.temp }}/wmcp-legacy-fed40dc07d9a6f6651430e54b0c48529b80f0327.sha256
          key: wmcp-legacy-v1-${{ runner.os }}-win-x64-fed40dc07d9a6f6651430e54b0c48529b80f0327
      - name: Publish exact-commit native application once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/WindowsAdminMcp/WindowsAdminMcp.csproj -c Release -r win-x64 --self-contained true --no-restore -o "${{ runner.temp }}/WindowsAdminMcpCandidate"
          if ($LASTEXITCODE -ne 0) { throw 'R1_PUBLISH_FAILED' }
      - name: Verify native service and MCP contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $params=@{Exe="${{ runner.temp }}/WindowsAdminMcpCandidate/WindowsAdminMCP.exe"}
          if($env:GITHUB_EVENT_NAME -eq 'push' -and '${{ steps.provenance.outputs.full }}' -ne 'true'){$params.SmokeOnly=$true}
          if($env:GITHUB_EVENT_NAME -in @('schedule','workflow_dispatch')){
            $params.LongBoundary=$true
            $params.Performance=$true
          }
          ./tests/Test-NativeStatus.ps1 @params
      - name: Build and test offline native installation package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path "${{ runner.temp }}" 'WindowsAdminMCP-win-x64.zip'
          $receipt=./installer/New-NativePackage.ps1 -PublishDirectory "${{ runner.temp }}/WindowsAdminMcpCandidate" -Output $package -Commit $env:GITHUB_SHA | ConvertFrom-Json
          Write-Host ("NATIVE_PACKAGE_SHA256="+$receipt.sha256)
          if($env:GITHUB_EVENT_NAME -eq 'push' -and '${{ steps.provenance.outputs.full }}' -ne 'true'){
            ./tests/Test-NativePackage.ps1 -Package $package -Sha256 $receipt.sha256 -SmokeOnly
          }else{
            ./tests/Test-NativePackage.ps1 -Package $package -Sha256 $receipt.sha256
          }
          $updateReceipt=[ordered]@{schema=1;commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;sha256=$receipt.sha256}
          [IO.File]::WriteAllText((Join-Path "${{ runner.temp }}" 'WindowsAdminMCP-update.json'),($updateReceipt|ConvertTo-Json -Compress))
      - name: Verify experimental SDK wire protocol
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build research/R0SdkProbe/R0SdkProbe.csproj -c Release --no-restore
          if($LASTEXITCODE -ne 0){throw 'SDK_BUILD_FAILED'}
          ./research/R0SdkProbe/Test-Wire.ps1 -Dll research/R0SdkProbe/bin/Release/net10.0/R0SdkProbe.dll
      - name: Exercise experimental SCM, SQLite and shared MCP queue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish research/R0NativeProbe/R0NativeProbe.csproj -c Release -r win-x64 --self-contained true --no-restore -o "${{ runner.temp }}/R0NativeProbe"
          if($LASTEXITCODE -ne 0){throw 'R0_PUBLISH_FAILED'}
          ./research/R0NativeProbe/Test-Native.ps1 -Exe "${{ runner.temp }}/R0NativeProbe/R0NativeProbe.exe" -SdkDll research/R0SdkProbe/bin/Release/net10.0/R0SdkProbe.dll
      - uses: actions/upload-artifact@v7
        if: success() && (github.event_name == 'push' || github.event_name == 'pull_request')
        with:
          name: WindowsAdminMCP-offline-package
          path: |
            ${{ runner.temp }}/WindowsAdminMCP-win-x64.zip
            ${{ runner.temp }}/WindowsAdminMCP-update.json
            installer/Install-Native.ps1
            installer/NativeFileSwap.ps1
            installer/VendorLock.Generated.ps1
          if-no-files-found: error
  release:
    # Preserve the release status check and verify the published bytes.
    # No second Windows VM, source checkout, restore or compilation.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: WindowsAdminMCP-offline-package
          path: package
      - name: Verify released package digest and source commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find package -type f -name 'WindowsAdminMCP-win-x64.zip')
          mapfile -t receipts < <(find package -type f -name 'WindowsAdminMCP-update.json')
          [[ ${#packages[@]} -eq 1 && ${#receipts[@]} -eq 1 ]] || exit 1
          actual=$(sha256sum "${packages[0]}" | cut -d ' ' -f 1)
          expected=$(jq -er '.sha256' "${receipts[0]}")
          [[ "${actual,,}" == "${expected,,}" ]] || exit 1
          [[ "$(jq -er '.commit' "${receipts[0]}")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(jq -er '.run_id | tostring' "${receipts[0]}")" == "$GITHUB_RUN_ID" ]] || exit 1
          echo "RELEASE_ARTIFACT_VERIFIED=$actual"
