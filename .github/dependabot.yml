version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      reviewed-nuget:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: 'deps(nuget)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      reviewed-actions:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: 'deps(actions)'
